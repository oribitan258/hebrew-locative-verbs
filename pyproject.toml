[project]
name = "hebloc"
version = "0.1.0"
description = "Data foundation for a study of Hebrew locative verbs across five historical corpora (Doron & Dubnov 2017 replication)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.scripts]
hebloc = "hebloc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hebloc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running checks (e.g. full sha256 re-verification of corpora/). Run with -m slow.",
]
addopts = "-m 'not slow'"
