# Locative-verb lexicon of S56-v1 (docs/EFRAT_SECTION_6.md §5.1; decisions D-053, D-057).
# ONLY ORI EDITS THIS FILE. Partners propose changes through their outbox.
#
# Source: Doron, E. & Dubnov, K. (2017). The locative alternation in Biblical (and Modern) Hebrew.
#   In A. Moshavi & T. Notarius (eds.), Advances in Biblical Hebrew Linguistics, 321-360.
#   Class lists: §4.1 (Causative), §6.1 (Intensive), footnote 33 (Simple). Other paper verbs: Tables 1, 2, 4,
#   ex. (18); Modern Hebrew supplement: §8.
#
# One entry per (root, template [, homograph]). Fields:
#   id                <root>.<S|I|C>[.<homograph gloss>]   (S = Simple, I = Intensive, C = Causative)
#   root, template, citation (the paper's citation form), gloss (the paper's translation)
#   class             A | A/B | B  (null for supplements the paper does not classify)
#   status            core (the class lists) | paper_other (Tables 1, 2, 4, ex. 18) | mh_supplement (§8)
#   list              where the paper lists it
#   putting_removal   PUTTING | REMOVAL | BOTH | UNKNOWN  (only what the paper says; else UNKNOWN)
#   paper_refs        examples/table rows: {where, frame|use, printed (as printed), he (Hebrew numbering, Mikra
#                     `ref` format), note}. Numbered examples: the paper's Hebrew parenthetical wins (its English
#                     references are sometimes wrong); table rows are English only and mapped by verse check.
#   dicta_lemmas      lemma strings Dicta outputs for THIS verb ({lemma, voice: active|passive|middle}); checked
#                     against Dicta's verb inventory of the five corpora (hebloc loc lexicon check --data).
#                     NEVER built from BHSA (BHSA is only the Mikra validation key, Phase C).
#   shared_lemmas     lemma strings Dicta uses for this verb AND for a non-lexicon verb ({lemma, other}): a token
#                     with such a lemma becomes a combined key with a "~" member (never counted as this verb alone)
#   excluded_lemmas   variants deliberately NOT used, with the reason (transparency)
#   flags             template_ambiguous | homograph | homograph_nonlexicon | paper_conflict | mh_meaning_shift |
#                     no_own_lemma | odd_lemma_string | template_mismatch_variant | change_of_state_use
#   nonlocative_idioms  object nouns that make the use idiomatic (positive NON_LOCATIVE evidence); clear
#                     dictionary knowledge only; reviewed by Ori
#   mh                §8 prediction: preserved_alternation | lost_frame_A_survives | mh_alternates |
#                     mh_new_alternator | mh_manner_locative ; bh_counterpart for MH lemmas of another template
#
# Forms for the fallback are NOT here: they are generated deterministically into config/locative_verb_forms.yaml
# (hebloc loc lexicon forms). lexicon_sha256 covers both files.

meta:
  methodology: S56-v1
  lexicon_version: r1
  transcription: {by: claude_code, date: "2026-11-20", reviewed_by: null, reviewed_on: null}
  stated_counts: {A: 95, A/B: 45, B: 37}
  stated_by_template:
    Causative: {A: 38, A/B: 7, B: 3}
    Intensive: {A: 12, A/B: 7, B: 15}
    Simple: {A: 45, A/B: 31, B: 19}
  discrepancies:
  - id: simple_A_46_vs_45
    what: "fn 33 lists 46 Simple-template A verbs but its text says 45 (\"45 Simple template verbs out of the 95 A verbs\"); the A lists therefore total 96, not 95."
    handling: "All 46 listed verbs are entries. lexicon check expects Simple A = 46 and A = 96 and reports the stated numbers next to them."
  - id: asar_list_A_vs_example_AB
    what: "אסר 'bind, harness' is in the fn 33 Simple A list, but example (33a/b) presents it as an A/B verb of putting."
    handling: "class A (the explicit list; Ori 2026-11-19), flag paper_conflict; the comparison with the paper is reported under both readings. Moving it to A/B would give A = 95 but A/B = 46."
  - id: template_collisions
    what: "Same root in two templates with different classes or entries: שלח (S, A) / שִׁלַּח (I, A/B); קבץ (S, A) / קִבֵּץ (I, A); חלץ (S, A) / חִלֵּץ (I, A); זרה (S, A) / זֵרָה (I, A); החסיר (C, A) / חִסֵּר (I, B); כרת (S, A) / הכרית (C, A)."
    handling: "Separate entries; tokens that cannot be told apart get a combined key (ambiguity rule, D-057)."
  - id: homographs
    what: "שחט 'squeeze' (fn 33 B) vs שחט 'slay' (Table 2); סך 'anoint' (root סוך, B) vs סכך 'thatch' (A/B) vs שך 'hedge' (root שוך, B)."
    handling: "Separate entries; shared lemmas/forms give combined keys."
  - id: fn5_excluded
    what: "fn 5: עקר 'uproot' is explicitly NOT included (found with a single complement only); its synonyms נסח and שׁרשׁ are."
    handling: "No entry for עקר."
  - id: english_references
    what: "Some English references in the paper differ from the Hebrew text it quotes (e.g. ex. 10b 'Ezra 9:10' vs (עזרא ט, יא); ex. 11b and 42a print a verse that does not contain the quoted words); tables use KJV numbering (e.g. Joel 3:2 = Hebrew Joel 4:2)."
    handling: "`he` holds the Hebrew-numbered verse that contains the quoted verb; `printed` keeps the paper's text; every difference has a note."
  ambiguity_rule: "One token = one instance. A token matching several entries (shared lemma or form) gets ONE combined verb_key (sorted ids joined by '|'); a token whose lemma is shared with a non-lexicon verb gets a '~' member. It is never assigned to one entry by default and never counted twice (D-057)."
  identification: "upos == VERB, and (lemma in dicta_lemmas | shared_lemmas) or (host in the generated forms file)."
  mh_general_prediction: "§8.2: BH A/(B) verbs (classes A and A/B) never become B verbs in MH."
  table3_simple_motion_verbs:   # intransitive Simple verbs of Table 3 (+ fn 17); used later by resolver variant R1
  - {verb: נגש, gloss: approach, ref: "Genesis 27:23"}
  - {verb: עלה, gloss: go up, ref: "I Kings 18:42"}
  - {verb: ירד, gloss: descend, ref: "Isaiah 55:10"}
  - {verb: טבע, gloss: sink, ref: "Jeremiah 38:6"}
  - {verb: עבר, gloss: cross over, ref: "II Samuel 15:24"}
  - {verb: פוץ, gloss: scatter, ref: "I Samuel 14:34"}
  - {verb: דבק, gloss: cling, ref: "Genesis 2:24"}
  - {verb: נצב, gloss: stand, ref: "Judges 18:17"}
  - {verb: נטה, gloss: be inclined, ref: "Judges 9:3"}
  - {verb: נוח, gloss: rest/stay, ref: "Joshua 10:4"}
  - {verb: נשאר, gloss: remain, ref: "Joshua 10:19"}
  - {verb: עמד, gloss: stand, ref: "II Chronicles 21:16"}
  - {verb: נזל, gloss: drip, ref: "Numbers 24:7"}
  - {verb: נפל, gloss: fall, ref: "Genesis 24:64"}
  - {verb: עתק, gloss: move, ref: "Job 14:18"}
  - {verb: נבדל, gloss: separate, ref: "Numbers 16:21"}
  - {verb: יצא, gloss: come out, ref: "Numbers 22:5"}
  - {verb: גלה, gloss: depart, ref: "I Samuel 4:21"}
  - {verb: נדח, gloss: be expelled, ref: "II Samuel 14:14"}
  - {verb: חסר, gloss: lack, ref: "Proverbs 31:11"}
  - {verb: אבד, gloss: become extinct, ref: "Deuteronomy 22:3"}
  - {verb: מוש, gloss: move away, ref: "Numbers 14:44"}
  - {verb: נסע, gloss: go away, ref: "Numbers 12:16"}
  - {verb: ישב, gloss: sit (fn 17), ref: null}
  - {verb: שכב, gloss: lie (fn 17), ref: null}

